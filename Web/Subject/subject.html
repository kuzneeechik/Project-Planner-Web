<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предмет</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>
</head>
<body>
    <header>
        <button class="back-button" id="backButton">
            <img src="назад.png" alt="Назад">
        </button>

        <h1 class="text-button" id="nameSubjectButton">Загрузка...</h1>

        <h3 class="text-button team-button">Команда</h3>
    </header>

    <section class="columns-container">
        
        <div class="column">
            <div class="column-header">
                <h4>создано</h4>
            </div>
            <div class="column-body" id="createdColumn">
            </div>
        </div>

        <div class="column">
            <div class="column-header">
                <h4>в процессе</h4>
            </div>
            <div class="column-body" id="processColumn">
            </div>
        </div>

        
        <div class="column">
            <div class="column-header">
                <h4>выполнено</h4>
            </div>
            <div class="column-body" id="doneColumn">
            </div>
        </div>
    </section>
    
    <button id="add-button" class="add-button">+</button>

    <div id="teamModal" class="modal-overlay">
        <div class="sidebar-content">
            
            <div class="sidebar-header">
                <h1>Команда</h1>
                <span class="close">&times;</span>
            </div>

            <div class="team-list" id="teamList">
            </div>
            <button class="buttonInvite" id="showInviteBtn">пригласить</button>
            <button class="buttonDelete" id="showDeleteBtn">удалить</button>
        </div>
    </div>

   <div id="taskModal" class="modal-overlay task-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Новая задача</h2>
            <form id="taskForm">
                <label for="taskName">Название:</label>
                <input type="text" id="taskName" placeholder="Введите название задачи" required>

                <label for="taskDescription">Описание:</label>
                <textarea id="taskDescription" rows="2" placeholder="Описание задачи"></textarea>
                <label for="taskDeadline">Дедлайн:</label>
                <input type="date" id="taskDeadline">

                <label>Ответственные:</label>
                <div id="assigneesList" class="checkbox-list">
                </div>

                <button type="submit" class="create-button">Создать задачу</button>
            </form>
        </div>
    </div>
    <div id="editSubjectModal" class="modal-overlay subject-modal">
        <div class="modal-content">
            <span class="close" id="closeEditSubjectModal">&times;</span>
            <h1 id="editModalTitle" style="text-align: center;">Редактировать предмет</h1>
            <form id="editSubjectForm">
                <label for="editSubjectName">Название предмета:</label>
                <input type="text" id="editSubjectName" required>

                <label for="editSubjectResult">Результат:</label>
                <textarea id="editSubjectResult" rows="1" required></textarea>

                <label for="editSubjectDescription">Описание:</label>
                <textarea id="editSubjectDescription" rows="2"></textarea>

                <label for="editSubjectDeadline">Дедлайн:</label>
                <input type="date" id="editSubjectDeadline">

                <div class="edit-modal-buttons">
                    <button type="button" id="deleteSubjectBtn">Удалить</button>
                    <button type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div id="inviteCodeModal" class="modal-overlay">
        <div class="modal-content invite-modal">
            <h2>Код предмета:</h2>
            <input type="text" id="inviteCode" readonly>
            <button id="closeInviteModal" class="team-modal-button">закрыть</button>
        </div>
    </div>

    <div id="deleteStudentsModal" class="modal-overlay">
        <div class="modal-content delete-students-modal">
            <h2>Удалить студентов</h2>
            <div id="deleteCheckboxList" class="checkbox-list"></div>
            <button id="confirmDelete" class="team-modal-button">удалить</button>
            <button id="closeDeleteModal" class="team-modal-button">отмена</button>
        </div>
    </div>
</body>
</html>
