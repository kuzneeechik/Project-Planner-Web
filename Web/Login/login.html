<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <h2 id="formTitle">Вход в систему</h2>

    <form id="loginForm" style="display: block;">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Пароль" required />
      <button type="submit">Войти</button>
      <p class="toggle">Нет аккаунта? <a href="#" id="switchToRegister">Зарегистрироваться</a></p>
    </form>

    <form id="registerForm" style="display: none;">
      <input type="text" id="registerName" placeholder="ФИО" required />
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input type="password" id="registerPassword" placeholder="Пароль" required />
      <input type="password" id="registerPasswordConfirm" placeholder="Подтвердите пароль" required />
      <button type="submit">Зарегистрироваться</button>
      <p class="toggle">Уже есть аккаунт? <a href="#" id="switchToLogin">Войти</a></p>
    </form>

    <div id="errorMessage" class="error" style="display: none;"></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
